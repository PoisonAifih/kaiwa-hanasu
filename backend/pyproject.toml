[project]
name = "hanasu-backend"
version = "0.1.0"
description = "Kaiwa-Hanasu backend: Japanese conversation practice API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "openai>=2.0",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",
    "sudachidict-core>=20240716",
    "sudachipy>=0.6.9",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
